[package]
name = "directedtype"
version = "0.1.0"
edition = "2021"
description = "A pure functional reactive layout engine based on a Directed Acyclic Graph (DAG) of layout equations"
license = "MIT OR Apache-2.0"
autoexamples = false

[workspace]
members = [
    ".",
    "directedtype-macros",
    "directedtype-guest",
    "xtask",
]

[features]
default = ["vello-renderer", "pdf"]
vello-renderer = [
    "dep:vello",
    "dep:winit",
    "dep:objc2",
    "dep:raw-window-handle",
    "dep:pollster",
]
pdf = ["dep:krilla"]

[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"
required-features = ["vello-renderer"]

[[bin]]
name = "docgen"
path = "src/bin/docgen.rs"
required-features = ["vello-renderer"]

[[bin]]
name = "vello_testbed"
path = "src/bin/vello_testbed.rs"
required-features = ["vello-renderer"]

[[bin]]
name = "dt2pdf"
path = "src/bin/dt2pdf.rs"
required-features = ["pdf"]

[dependencies]
directedtype-guest = { path = "directedtype-guest" }
directedtype-macros = { path = "directedtype-macros" }
image = "0.25.10"
logos = "0.14"
notify = "8.2.0"
parley = "0.11.1"
roxmltree = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skrifa = "0.44.0"
thiserror = "2.0"
usvg = "0.45"
wasmi = "2.0.0"

# Optional vector PDF backend
krilla = { version = "0.8", features = ["raster-images"], optional = true }

# Optional Vello GPU / interactive window stack
objc2 = { version = "0.5.2", optional = true }
pollster = { version = "1.0.1", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
vello = { version = "0.10.0", optional = true }
winit = { version = "0.30.13", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"

